[platformio]
default_envs = panel_4848s040
src_dir = src
test_dir = test

[env:native]
platform = native
build_type = debug
test_framework = unity
test_build_src = false
lib_ldf_mode = chain
build_flags =
  -std=c++17
  -Iplatformio/src
  -Iinclude

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
  -std=c++17
  -DCORE_DEBUG_LEVEL=3
  -DWIFI_SSID="CHANGE_ME"
  -DWIFI_PASSWORD="CHANGE_ME"
lib_ldf_mode = chain

[env:panel_4848s040]
platform = espressif32@6.8.1
board = esp32-s3-devkitm-1
framework = arduino
monitor_speed = 115200
build_type = release
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.psram_type = opi
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions_ota_16mb.csv
build_flags =
  -D BOARD_PANEL_4848S040=1
  -D BOARD_HAS_PSRAM=1
  -D CORE_DEBUG_LEVEL=3
  -D PANEL_PRODUCTION_BUILD=1
  -Iinclude
lib_ldf_mode = chain
lib_deps =
  moononournation/GFX Library for Arduino@1.5.9
